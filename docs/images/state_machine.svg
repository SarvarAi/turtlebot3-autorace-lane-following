<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M180,107 L232,107"/>
    <path d="M385,107 L437,107"/>
    <path d="M590,107 L642,107"/>
    <path d="M720,134 L720,246"/>
