    <path d="M440,277 L387,277"/>
  </g>

  <path d="M310,80 C310,40 105,40 105,76" stroke="#8b949e" stroke-width="2" fill="none"
        stroke-dasharray="5 4" marker-end="url(#a)"/>

  <g font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="30"  y="80" width="150" height="54" rx="8" fill="#A16207"/>
